name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes automatizados
        run: npm test

      - name: Smoke test
        run: npm run test:smoke

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Build da imagem Docker
        run: docker build --pull -t lab40:feature08 .

      - name: Executar container efêmero
        run: docker run -d --name lab40-container -p 3000:3000 lab40:feature08

      - name: Validar /health e feature 08
        run: |
          for i in $(seq 1 15); do
            curl --fail --silent http://localhost:3000/health && break
            sleep 2
          done
          curl --fail http://localhost:3000/health
          curl --fail -X POST http://localhost:3000/api/features/8 \
            -H "Content-Type: application/json" \
            -d '{"numero":5}' | grep '"resultado":120'

      - name: Logs do container
        if: always()
        run: docker logs lab40-container || true

      - name: Parar container
        if: always()
        run: docker rm -f lab40-container || true

      - name: Exportar imagem
        run: docker save lab40:feature08 -o lab40-feature08.tar

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: lab40-image
          path: lab40-feature08.tar